name: Import Android project ZIP

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: ${{ hashFiles('kanji-sammler-android-project.zip') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf kanji-sammler-android
          unzip -oq kanji-sammler-android-project.zip
          cp -a kanji-sammler-android/. .
          rm -rf kanji-sammler-android kanji-sammler-android-project.zip

      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Import Kanji-Sammler Android project"
          git push
