name: Build Kanji-Sammler APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract Android project
        run: |
          rm -rf kanji-sammler-android
          unzip -oq kanji-sammler-android-project.zip
          test -f kanji-sammler-android/settings.gradle
          test -f kanji-sammler-android/app/src/main/AndroidManifest.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: kanji-sammler-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: kanji-sammler-debug-apk
          path: kanji-sammler-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
